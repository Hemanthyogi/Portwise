spring:
  application:
    name: portwise-backend-test
  datasource:
    url: jdbc:h2:mem:portwise_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: portwise_dev_secret_key_at_least_64_chars_long_please_change_this_test_secret_long
    expiration-ms: 86400000
  demo-mode: true
